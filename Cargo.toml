[package]
name = "spring_damper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Damped springs and motion transitions"
readme = "README.md"
exclude = ["tools/goldens/upstream/**"]

[features]
default = ["glam"]
glam = ["dep:glam"]
bevy = ["glam", "dep:bevy_app", "dep:bevy_ecs", "dep:bevy_math", "dep:bevy_transform", "dep:bevy_time", "dep:bevy_reflect"]

[dependencies]
glam = { version = "=0.32.0", optional = true }
bevy_app = { version = "=0.19.1", default-features = false, features = ["std", "bevy_reflect"], optional = true }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std", "bevy_reflect"], optional = true }
bevy_math = { version = "=0.19.1", default-features = false, features = ["std", "bevy_reflect"], optional = true }
bevy_transform = { version = "=0.19.1", default-features = false, features = ["std", "bevy_reflect"], optional = true }
bevy_time = { version = "=0.19.1", default-features = false, features = ["std"], optional = true }
bevy_reflect = { version = "=0.19.1", default-features = false, features = ["std", "glam"], optional = true }

[dev-dependencies]
serde_json = "1"
flate2 = "1"
bevy = { version = "=0.19.1", default-features = false, features = ["std", "bevy_gizmos", "bevy_gizmos_render", "bevy_log", "bevy_sprite_render", "bevy_pbr", "bevy_core_pipeline", "bevy_render", "bevy_winit", "png", "x11", "tonemapping_luts", "zstd_rust"] }

[lints.clippy]
# Upstream signatures and constants remain recognizable.
too_many_arguments = "allow"
excessive_precision = "allow"
approx_constant = "allow"

[[example]]
name = "spring_gallery"
required-features = ["bevy"]

[[example]]
name = "transform_springs"
required-features = ["bevy"]
